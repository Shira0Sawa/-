<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 这行代码非常重要，它告诉手机浏览器不要缩放网页，按设备宽度显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲 - 护甲/头盔维修计算器</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; margin: 0; }
        
        /* PC端布局：默认左右并排 */
        .main-container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; justify-content: center; align-items: flex-start; }
        
        /* 面板通用样式，去掉了 min-width，改用 width: 100% 配合 flex */
        .panel { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }
        
        h2 { text-align: center; color: #2c3e50; margin-top: 0; padding-bottom: 10px; border-bottom: 2px solid #eee; }
        
        .form-group { margin-bottom: 15px; display: flex; align-items: center; }
        .form-group label { width: 110px; font-weight: bold; font-size: 14px; flex-shrink: 0; }
        .form-group select, .form-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        .form-group select:focus, .form-group input:focus { border-color: #3498db; }
        
        .btn { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
        .btn:hover { background-color: #2980b9; }
        
        .result-box { margin-top: 20px; padding: 15px; background-color: #ecf0f1; border-radius: 4px; display: none; }
        .result-box h3 { margin-top: 0; font-size: 16px; color: #2c3e50; border-bottom: 1px dashed #bdc3c7; padding-bottom: 8px;}
        .result-item { margin-bottom: 8px; font-size: 14px; }
        .result-item span { font-weight: bold; color: #e74c3c; }
        
        .package-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 13px; }
        .package-table th, .package-table td { border: 1px solid #ddd; padding: 8px 4px; text-align: center; }
        .package-table th { background-color: #f8f9fa; }

        /* ==========================================
           手机端适配（当屏幕宽度小于 900px 时生效）
           ========================================== */
        @media (max-width: 900px) {
            body { padding: 10px; }
            /* 将左右排列改为上下排列 */
            .main-container { flex-direction: column; gap: 15px; }
            .panel { padding: 15px; }
            h2 { font-size: 18px; }
            
            /* 稍微缩小标签和字体，节省手机空间 */
            .form-group label { width: 95px; font-size: 13px; }
            .form-group select, .form-group input { font-size: 13px; padding: 6px; }
            .btn { font-size: 14px; padding: 8px; }
            .result-item { font-size: 13px; }
            .package-table th, .package-table td { padding: 6px 2px; font-size: 12px; }
        }
    </style>
</head>

<div class="main-container">

            <label>选择头盔：</label>

        </div>

            <label>维修模式：</label>

                <option value="outside">局外维修</option>
            </select>
        </div>
        <div class="form-group" id="helmet_outsideLevelGroup" style="display: none;">

                <option value="primary">初级维修 (损耗x1.25)</option>
            </select>
        </div>
        <div class="form-group">

        <div class="form-group">

// ==========================================
// 2. 核心计算类
// ==========================================
class ArmorRepairCalculator {
  calculateRepairLoss(armor, repairData) {
    try {
      if (repairData.repairMode === 'inside') {
        return this.calculateInsideRepair(armor, repairData)
      } else {
        return this.calculateOutsideRepair(armor, repairData)
      }
    } catch (error) {
      return { success: false, error: error.message }
    }
  }

  calculateInsideRepair(armor, repairData) {
    const { currentDurability, remainingDurability } = repairData
    if (!armor || remainingDurability > currentDurability) return { success: false, error: '无效的维修参数' }
    
    const initialMax = armor.initialMax
    const repairLoss = armor.repairLoss
    if (repairLoss === undefined) return { success: false, error: `护甲 ${armor.name} 缺少维修损耗数据` }
    
    const d_initialMax = parseFloat(initialMax.toString())
    const d_repairLoss = parseFloat(repairLoss.toString())
    const d_currentMax = parseFloat(currentDurability.toString())
    const d_remainingDurability = parseFloat(remainingDurability.toString())
    
    let ratio = 0
    if (d_currentMax !== 0) ratio = (d_currentMax - d_remainingDurability) / d_currentMax
    
    let logTerm = 0
    if (d_currentMax > 0 && d_initialMax > 0) logTerm = Math.log10(d_currentMax / d_initialMax)
    
    const repairedMax = d_currentMax - d_currentMax * ratio * (d_repairLoss - logTerm)
    const repairedMaxForCalculation = Math.round(repairedMax * 100) / 100
    const delta = repairedMaxForCalculation - d_remainingDurability
    
    const repairPackages = []
    const packageTypes = [
      { key: 'self_made', name: '自制维修包' },
      { key: 'standard', name: '标准维修包' },
      { key: 'precision', name: '精密维修包' },
      { key: 'advanced', name: '高级维修组合' }
    ]
    
    for (const packageType of packageTypes) {
      const efficiency = this.getInsideRepairEfficiency(armor, packageType.key)
      let consumption = '暂无数据'
      if (efficiency === null || efficiency === undefined) consumption = '暂无数据'
      else if (efficiency === 0) consumption = '无穷大'
      else if (delta <= 0) consumption = '无效值'
      else consumption = Math.floor(delta / efficiency)
      
      repairPackages.push({ name: packageType.name, efficiency, consumption })
    }

    return {
      success: true, mode: '局内维修', armor: armor.name,
      currentMax: currentDurability, remainingDurability,
      repairedMax: Math.round(repairedMax * 10) / 10, repairLoss, repairPackages
    }
  }

  calculateOutsideRepair(armor, repairData) {
    const { repairLevel, currentDurability, remainingDurability } = repairData
    if (!armor || currentDurability <= 0) return { success: false, error: '无效的维修参数' }
    
    const repairMultiplier = repairLevel === 'primary' ? 1.25 : 1.0
    const levelName = repairLevel === 'primary' ? '初级维修' : '中级维修'
    const baseRepairLoss = armor.repairLoss
    const baseRepairPrice = armor.repairPrice
    
    if (baseRepairLoss === undefined || baseRepairPrice === undefined) return { success: false, error: `护甲 ${armor.name} 缺少维修数据` }
    
    const adjustedRepairLoss = Math.min(baseRepairLoss * repairMultiplier, 1.0)
    const adjustedRepairPrice = baseRepairPrice * repairMultiplier
    const initialMax = armor.initialMax
    const currentUpperProcessed = Math.floor(currentDurability)
    const remainingDurabilityDec = remainingDurability !== undefined ? remainingDurability : currentUpperProcessed
    
    const isHelmet = armor.name.includes('头盔') || armor.name.includes('盔') || armor.name.includes('帽');
    if (isHelmet && currentUpperProcessed < 5) return { success: false, error: `当前头盔上限(${currentUpperProcessed})小于5，不可维修` }
    if (!isHelmet && currentUpperProcessed < 10) return { success: false, error: `当前护甲上限(${currentUpperProcessed})小于10，不可维修` }
    
    try {
      const term1 = (currentUpperProcessed - remainingDurabilityDec) / currentUpperProcessed
      if (currentUpperProcessed <= 0 || initialMax <= 0) throw new Error("对数计算参数必须大于0")
      const logValue = currentUpperProcessed / initialMax
      if (logValue <= 0) throw new Error("对数计算参数必须大于0")
      
      const logTerm = Math.log10(logValue)
      const term2 = adjustedRepairLoss - logTerm
      const repairedUpper = currentUpperProcessed - currentUpperProcessed * term1 * term2
      
      if (isNaN(repairedUpper) || !isFinite(repairedUpper)) throw new Error("计算结果无效")
      
      let finalUpper = Math.floor(repairedUpper)
      if (finalUpper < 1) finalUpper = 1
      
      const remainingInt = Math.floor(remainingDurabilityDec)
      let repairCost = (finalUpper - remainingInt + 1) * adjustedRepairPrice
      repairCost = repairCost < 0 ? 0 : Math.round(repairCost)
      
      const wearPercentage = (1 - finalUpper / initialMax) * 100
      let marketStatus = ''
      const nonTradableEquipments = ["金刚防弹衣", "特里克MAS2.0装甲", "泰坦防弹装甲", "DICH-9重型头盔", "GT5指挥官头盔", "H70夜视精英头盔"]
      
      if (nonTradableEquipments.includes(armor.name)) {
        marketStatus = "不可在市场进行交易"
      } else {
        const threshold85 = Math.floor(initialMax * 0.85)
        const threshold70 = Math.floor(initialMax * 0.70)
        if (finalUpper >= threshold85) marketStatus = "略有磨损，可在市场出售"
        else if (finalUpper >= threshold70) marketStatus = "久经沙场，可在市场出售"
        else marketStatus = "破损不堪，不可在市场出售"
      }

      return {
        success: true, mode: '局外维修', armor: armor.name, repairLevel: levelName,
        initialMax, currentDurability: currentUpperProcessed, remainingDurability: remainingDurabilityDec,
        finalUpper, repairLoss: adjustedRepairLoss, repairCost,
        wearPercentage: Math.round(wearPercentage * 10) / 10, marketStatus
      }
    } catch (error) {
      return { success: false, error: `计算错误: ${error.message}` }
    }
  }

  getInsideRepairEfficiency(armor, repairType) {
    if (!armor || !armor.repairEfficiencies) return null
    const efficiencies = armor.repairEfficiencies
    const keys = Object.keys(efficiencies)
    const isOldFormat = keys.some(key => ['3', '6', '8', '9'].includes(key))
    
    if (isOldFormat) {
      const repairTypeToKey = { 'self_made': '3', 'standard': '6', 'precision': '8', 'advanced': '9' }
      const key = repairTypeToKey[repairType]
      if (!key || !efficiencies[key]) return null
      return parseFloat(efficiencies[key]) || null
    } else {
      const sortedKeys = keys.sort((a, b) => parseFloat(a) - parseFloat(b))
      const repairTypeToIndex = { 'self_made': 0, 'standard': 1, 'precision': 2, 'advanced': 3 }
      const index = repairTypeToIndex[repairType]
      if (index === undefined || index >= sortedKeys.length) return null
      return parseFloat(sortedKeys[index]) || null
    }
  }
}

// ==========================================
// 3. 页面交互逻辑
// ==========================================
const calculator = new ArmorRepairCalculator();
let helmetDataList = []; 
let armorDataList = [];  

function initSelects() {
    const helmetSelect = document.getElementById('helmetSelect');
    helmetDataList = [...gameData.armors.helmets].sort((a, b) => b.protectionLevel - a.protectionLevel);
    helmetDataList.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `[${item.protectionLevel}级] ${item.name}`;
        helmetSelect.appendChild(opt);
    });

    const armorSelect = document.getElementById('armorSelect');
    armorDataList = [...gameData.armors.body_armor].sort((a, b) => b.protectionLevel - a.protectionLevel);
    armorDataList.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index;
        opt.textContent = `[${item.protectionLevel}级] ${item.name} (${item.type})`;
        armorSelect.appendChild(opt);
    });
}

function toggleMode(type) {
    const mode = document.getElementById(`${type}Mode`).value;
    document.getElementById(`${type}_outsideLevelGroup`).style.display = mode === 'outside' ? 'flex' : 'none';
}

function calculate(type) {
    let armorData, resultBoxId;
    
    if (type === 'helmet') {
        const index = document.getElementById('helmetSelect').value;
        armorData = helmetDataList[index];
        resultBoxId = 'helmetResultBox';
    } else {
        const index = document.getElementById('armorSelect').value;
        armorData = armorDataList[index];
        resultBoxId = 'armorResultBox';
    }

    const mode = document.getElementById(`${type}Mode`).value;
    const repairLevel = document.getElementById(`${type}RepairLevel`).value;
    const currentDurability = parseFloat(document.getElementById(`${type}CurrentDur`).value);
    const remainingDurability = parseFloat(document.getElementById(`${type}RemainDur`).value);

    if (isNaN(currentDurability) || isNaN(remainingDurability)) {
        alert("请输入有效的耐久数值！");
        return;
    }

    const params = { repairMode: mode, currentDurability, remainingDurability };
    if (mode === 'outside') params.repairLevel = repairLevel;

    const result = calculator.calculateRepairLoss(armorData, params);
    
    renderResult(resultBoxId, result);
}

function renderResult(boxId, res) {
    const box = document.getElementById(boxId);
    box.style.display = 'block';

    if (!res.success) {
        box.innerHTML = `<h3 style="color:red;">计算失败</h3><p>${res.error}</p>`;
        return;
    }

    let html = `<h3>${res.armor} - ${res.mode}</h3>`;
    
    if (res.mode === '局内维修') {
        html += `
            <div class="result-item">维修后上限：<span>${res.repairedMax}</span></div>
            <div class="result-item">当前损耗率：<span>${(res.repairLoss * 100).toFixed(1)}%</span></div>
            <table class="package-table">
                <tr><th>维修包</th><th>效率</th><th>需要点数</th></tr>
                ${res.repairPackages.map(p => `<tr><td>${p.name}</td><td>${p.efficiency}</td><td><strong>${p.consumption}</strong></td></tr>`).join('')}
            </table>
        `;
    } else {
        html += `
            <div class="result-item">初始上限：${res.initialMax} | 当前上限：<span>${res.currentDurability}</span></div>
            <div class="result-item">维修后上限：<span>${res.finalUpper}</span></div>
            <div class="result-item">装备磨损度：<span>${res.wearPercentage}%</span></div>
            <div class="result-item">维修总花费：<span>${res.repairCost} 哈夫币</span></div>
            <div class="result-item">交易行状态：<span>${res.marketStatus}</span></div>
        `;
    }
    
    box.innerHTML = html;
}

window.onload = () => {
    initSelects();
    toggleMode('helmet');
    toggleMode('armor');
};
</script>
